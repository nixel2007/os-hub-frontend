<h1>Войти в систему</h1>

{% Если ЗначениеЗаполнено(Модель.Ошибка) Тогда %}
<div class="ui error message">{{ Модель.Ошибка }}</div>
{% КонецЕсли; %}

<form method="POST" action="/office/login" class="ui form">
    <div class="field">
        <label for="Name">Пользователь</label>
        <input name="Name"/>
    </div>
    <div class="field">
        <label for="Password">Пароль</label>
        <input type="password" name="Password"/>
    </div>
    <button class="ui primary button" type="submit">Вход</button>
</form>
