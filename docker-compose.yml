version: "3"
services:
  os-hub:
    build: .
    ports:
     - 8000:5000
    environment:
     - OSHUB_BINARY_ROOT=/opt/opm-hub/packages
     - GITHUB_SUPER_TOKEN
     - OSWEB_DATABASE__CONNECTIONSTRING
     - OSHUB_DEFAULT_USER
     - OSHUB_DEFAULT_PASSWORD
     - OSHUB_TG_NOTIFICATION
     - TELEGRAM_TOKEN
     - TELEGRAM_GROUP_ID
    depends_on:
      - db
    volumes:
      - ./docker/share:/var/www
      - ./docker/packages:/opt/opm-hub/packages
  db:
    image: postgres
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    volumes:
      - ./docker/database:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL
      - PGADMIN_DEFAULT_PASSWORD
    ports:
      - 8080:80
    restart: unless-stopped
